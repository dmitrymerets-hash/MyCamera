name: Build My Camera APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleDebug :viewer:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyCamera-Camera-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyCamera-Viewer-APK
          path: viewer/build/outputs/apk/debug/viewer-debug.apk
